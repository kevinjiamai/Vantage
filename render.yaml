services:
  - type: web
    name: vantage-api
    runtime: python
    plan: free
    region: oregon
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Comma-separated browser origins allowed to call the API (include your frontend URL).
      - key: VANTAGE_CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://vantage-orcin-rho.vercel.app,https://vantage-keirawang1.vercel.app,https://vantage-g2jl.vercel.app,https://vantage-g2jl-keirawang1.vercel.app"
      # Model behind /api/chat. Any OpenAI-compatible endpoint; leave LLM_API_KEY
      # unset to run without a shared model (users can still connect their own).
      - key: LLM_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai"
      - key: LLM_MODEL
        value: "gemini-flash-latest"
      - key: LLM_API_KEY
        sync: false
      # Verifies Firebase ID tokens so chat can be metered per user. No service
      # account needed - tokens are checked against Google's public certs.
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Questions per day, by tier. Omit to use the defaults (3 / 20 / 200).
      - key: CHAT_LIMIT_ANONYMOUS
        value: "3"
      - key: CHAT_LIMIT_FREE
        value: "20"
      - key: CHAT_LIMIT_PLUS
        value: "200"
      # Comma-separated uids granted the plus tier.
      - key: CHAT_PLUS_UIDS
        sync: false
      - key: VANTAGE_CORS_ORIGIN_REGEX
        value: "https://(vantage|vantage-g2jl)(-[a-z0-9-]+)*\\.vercel\\.app"