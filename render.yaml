# Template. Real values are set in the Render dashboard, never committed.
# Copy this into a new Blueprint or configure the service manually.
services:
  - type: web
    name: vantage-api
    runtime: python
    plan: free
    region: oregon
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"

      # ── Required, set in the dashboard ───────────────────────────────────────
      # Signs session tokens. Generate with: openssl rand -base64 48
      - key: SECRET_KEY
        sync: false
      # postgresql://... in production; omit to fall back to local SQLite, which
      # does NOT survive a redeploy on an ephemeral filesystem.
      - key: DATABASE_URL
        sync: false

      # ── Chat model (optional; without it users must connect their own) ───────
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false

      # ── Browser origins allowed to call this API ─────────────────────────────
      # Note: CORS restricts browsers only. It is not access control; the quota
      # and session checks are what actually defend these endpoints.
      - key: VANTAGE_CORS_ORIGINS
        sync: false
      - key: VANTAGE_CORS_ORIGIN_REGEX
        sync: false

      # ── Chat quota per tier, questions per UTC day ───────────────────────────
      - key: CHAT_LIMIT_ANONYMOUS
        value: "3"
      - key: CHAT_LIMIT_FREE
        value: "20"
      - key: CHAT_LIMIT_PLUS
        value: "200"
